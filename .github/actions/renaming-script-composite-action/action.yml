name: "Test renaming script"
runs:
  using: "composite"
  steps:
    - name: "Setting permissions for script"
      run: chmod +x set_app_name.sh
      shell: bash
    - name: "Testing renaming script with missing APP_NAME"
      run: "! ./set_app_name.sh"
      shell: bash
    - name: "Testing renaming script with invalid name (unsupported characters)"
      run: export APP_NAME="#INVALID" && ! ./set_app_name.sh
      shell: bash
    - name: "Testing renaming script with invalid name (exceeding length)"
      run: export APP_NAME="this-app-has-a-name-that-exceeds-fifty-three-characters" && ! ./set_app_name.sh
      shell: bash
    - name: "Testing renaming script with valid name"
      run: export APP_NAME="valid-app-name" && ./set_app_name.sh
      shell: bash
    - name: "Verify environment variable names are not mangled"
      run: |
        # APP_NAMESPACE must remain intact in both deployment YAML and config.py
        if ! grep -q "APP_NAMESPACE" charts/valid-app-name/templates/deployment/deployment.yaml; then
          echo "FAIL: APP_NAMESPACE was mangled in deployment.yaml"
          exit 1
        fi
        if ! grep -q '"APP_NAMESPACE"' eric-oss-hello-world-python-app/config.py; then
          echo "FAIL: APP_NAMESPACE was mangled in config.py"
          exit 1
        fi
        echo "PASS: Environment variable names preserved correctly"
      shell: bash